plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chk.srtstudio'
    compileSdk 34

    defaultConfig {
        applicationId "com.chk.srtstudio"
        minSdk 21
        targetSdk 34
        versionCode 21
        versionName "2.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
