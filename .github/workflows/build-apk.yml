name: Build SRT Studio Auto APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Générer le wrapper complet
        run: gradle wrapper --gradle-version 8.7

      - name: Autoriser gradlew
        run: chmod +x gradlew

      - name: Compiler APK debug
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Préparer APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SRT-Studio-Auto-v2.0.1-debug.apk

      - name: Publier APK dans Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SRT-Studio-Auto-APK
          path: SRT-Studio-Auto-v2.0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
